<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>

  <!-- React 18 и ReactDOM через CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel: трансформирует JSX прямо в браузере (подходит для обучения; позже заменить на сборщик) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Обёртка приложения ── */
    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    header h1 { font-size: 1.6rem; font-weight: 700; }

    /* ── Кнопка добавления задачи ── */
    .add-btn {
      padding: 8px 18px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .add-btn:hover { background: #1d4ed8; }

    /* ── Вкладки списков ── */
    .list-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
      /* Скрываем полосу прокрутки визуально, но оставляем функциональность */
      scrollbar-width: none;
    }
    .list-tabs::-webkit-scrollbar { display: none; }

    .list-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .list-tab:hover { background: #f3f4f6; }

    /* Активная вкладка выделена синим */
    .list-tab.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* Кнопка удаления вкладки — маленький крестик внутри таба */
    .tab-delete {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.55;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0 1px;
      transition: opacity 0.15s;
    }
    .tab-delete:hover { opacity: 1; }

    /* Кнопка создания нового списка — пунктирный таб с «+» */
    .tab-add {
      padding: 6px 14px;
      background: none;
      border: 1px dashed #d1d5db;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      color: #9ca3af;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    .tab-add:hover { border-color: #9ca3af; color: #6b7280; }

    /* ── Панель выбора даты просмотра ── */
    .date-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .date-nav input[type="date"] {
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .date-nav input[type="date"]:focus { border-color: #2563eb; }

    /* Кнопка «Сегодня» — видна только при просмотре другой даты */
    .today-btn {
      padding: 7px 14px;
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .today-btn:hover { background: #e5e7eb; }

    /* ── Заголовки секций ── */
    section { margin-bottom: 24px; }

    section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .overdue-section h2 { color: #ef4444; }

    .empty {
      font-size: 0.9rem;
      color: #9ca3af;
      padding: 12px 0;
    }

    /* ── Карточка задачи ── */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }

    /* Просроченные задачи получают красную левую границу */
    .task-item.overdue {
      border-left: 3px solid #ef4444;
      background: #fff5f5;
    }

    /* Выполненные задачи приглушены, название зачёркнуто */
    .task-item.completed { opacity: 0.5; }
    .task-item.completed .task-title { text-decoration: line-through; }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #2563eb;
      flex-shrink: 0;
    }

    .task-title {
      flex: 1;
      font-size: 0.95rem;
    }

    .task-date {
      font-size: 0.78rem;
      color: #9ca3af;
      white-space: nowrap;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      color: #d1d5db;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s;
    }
    .delete-btn:hover { color: #ef4444; }

    /* ── Индикатор приоритета — цветная точка перед названием задачи ── */
    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Селектор приоритета в модалке — три кнопки в ряд ── */
    .priority-selector {
      display: flex;
      gap: 8px;
    }

    .priority-option {
      flex: 1;
      padding: 8px 0;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .priority-option:hover { background: #f3f4f6; }

    /* ── Затемнение под модальным окном ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      width: min(420px, 92vw);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .modal h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .modal form { display: flex; flex-direction: column; gap: 12px; }

    .modal input[type="text"],
    .modal input[type="date"] {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input:focus { border-color: #2563eb; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .modal-actions button {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-actions .btn-cancel {
      background: #f3f4f6;
      color: #374151;
    }
    .modal-actions .btn-cancel:hover { background: #e5e7eb; }

    .modal-actions .btn-submit {
      background: #2563eb;
      color: #fff;
    }
    .modal-actions .btn-submit:hover { background: #1d4ed8; }

    /* ── Счётчик задач в шапке ── */
    .task-counter {
      font-size: 0.8rem;
      color: #9ca3af;
      font-weight: 400;
      margin-top: 2px;
    }
    .task-counter .counter-done { color: #22c55e; font-weight: 600; }

    header .header-left { display: flex; flex-direction: column; }

    /* ── Мотивационный тост ── */
    .motiv-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: #1e293b;
      color: #f8fafc;
      padding: 11px 22px;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      white-space: nowrap;
      pointer-events: none;
      z-index: 200;
      animation: toastIn 0.25s ease, toastOut 0.3s ease 2.2s forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0); }
      to   { opacity: 0; transform: translateX(-50%) translateY(16px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Мотивационные фразы ───────────────────────────────────
    const MOTIVATIONS = [
      'Отличный настрой — задача уже в деле!',
      'Каждая задача — шаг вперёд.',
      'Записал — значит сделаешь!',
      'Ещё одна цель, ещё один успех.',
      'Фокус и действие — твой рецепт.',
      'Список пополнен, прогресс продолжается.',
      'Маленький план — большой результат.',
    ];

    // ── Константы ────────────────────────────────────────────
    const STORAGE_KEY = 'todo-app';      // ключ нового формата
    const LEGACY_KEY  = 'todo-tasks';    // ключ старого формата (V1)
    const DEFAULT_LIST_ID = 'default';

    /**
     * Справочник приоритетов.
     * order — порядок сортировки (меньше = выше в списке).
     */
    const PRIORITIES = {
      high:   { label: 'Высокий', color: '#ef4444', order: 0 },
      medium: { label: 'Средний', color: '#f59e0b', order: 1 },
      low:    { label: 'Низкий',  color: '#9ca3af', order: 2 },
    };

    // ── Вспомогательные функции ───────────────────────────────

    /** Возвращает сегодняшнюю дату в формате YYYY-MM-DD (локальный часовой пояс). */
    function getToday() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    /**
     * Форматирует дату YYYY-MM-DD в читаемый вид для заголовка секции.
     * Например: "2025-03-20" → "20 марта 2025"
     */
    function formatDateHeading(dateStr) {
      const [yyyy, mm, dd] = dateStr.split('-');
      const d = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    /**
     * Загружает данные приложения из LocalStorage.
     * При первом запуске (или если данных нет) создаёт дефолтный список
     * и мигрирует задачи из формата V1 (ключ 'todo-tasks'), если они есть.
     */
    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.lists)) return saved;
      } catch {}

      // Миграция задач из старого формата V1
      let legacyTasks = [];
      try {
        legacyTasks = JSON.parse(localStorage.getItem(LEGACY_KEY)) || [];
      } catch {}

      return {
        lists: [{ id: DEFAULT_LIST_ID, name: 'Мои задачи' }],
        // Привязываем старые задачи к дефолтному списку
        tasks: legacyTasks.map(t => ({ ...t, listId: DEFAULT_LIST_ID })),
        activeListId: DEFAULT_LIST_ID,
      };
    }

    /** Сохраняет все данные приложения в LocalStorage одним объектом. */
    function saveData({ lists, tasks, activeListId }) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ lists, tasks, activeListId }));
    }

    /**
     * Сортирует задачи по приоритету: Высокий → Средний → Низкий.
     * Задачи без поля priority считаются «Средним».
     */
    function sortByPriority(arr) {
      return [...arr].sort(
        (a, b) =>
          (PRIORITIES[a.priority ?? 'medium'].order) -
          (PRIORITIES[b.priority ?? 'medium'].order)
      );
    }

    // Загружаем данные один раз при старте приложения
    const initialData = loadData();

    // ── TaskItem ─────────────────────────────────────────────
    /**
     * Строка одной задачи.
     * Пропсы: task, isOverdue, onToggle(id), onDelete(id)
     */
    function TaskItem({ task, isOverdue, onToggle, onDelete }) {
      // Формируем строку CSS-классов в зависимости от состояния задачи
      const classes = [
        'task-item',
        isOverdue ? 'overdue' : '',
        task.completed ? 'completed' : '',
      ].filter(Boolean).join(' ');

      // Берём метаданные приоритета; если поле не задано — считаем «Средним»
      const priority = PRIORITIES[task.priority ?? 'medium'];

      return (
        <div className={classes}>
          {/* Чекбокс переключает статус выполнения */}
          <input
            type="checkbox"
            checked={task.completed}
            onChange={() => onToggle(task.id)}
            aria-label={`Отметить "${task.title}"`}
          />
          {/* Цветная точка — визуальный индикатор приоритета */}
          <span
            className="priority-dot"
            style={{ background: priority.color }}
            title={priority.label}
          />
          <span className="task-title">{task.title}</span>
          <span className="task-date">{task.dueDate}</span>
          {/* Кнопка удаления */}
          <button
            className="delete-btn"
            onClick={() => onDelete(task.id)}
            aria-label="Удалить задачу"
            title="Удалить"
          >×</button>
        </div>
      );
    }

    // ── ListTabs ──────────────────────────────────────────────
    /**
     * Горизонтальная полоса вкладок списков.
     * Пропсы: lists, activeListId, onSwitch(id), onAdd(), onDelete(id)
     */
    function ListTabs({ lists, activeListId, onSwitch, onAdd, onDelete }) {
      return (
        <div className="list-tabs">
          {lists.map(list => (
            <div
              key={list.id}
              className={`list-tab ${list.id === activeListId ? 'active' : ''}`}
              onClick={() => onSwitch(list.id)}
              title={list.name}
            >
              <span>{list.name}</span>
              {/* Кнопка удаления скрыта, если список единственный */}
              {lists.length > 1 && (
                <button
                  className="tab-delete"
                  onClick={e => { e.stopPropagation(); onDelete(list.id); }}
                  aria-label={`Удалить список "${list.name}"`}
                  title="Удалить список"
                >×</button>
              )}
            </div>
          ))}
          {/* Кнопка создания нового списка */}
          <button className="tab-add" onClick={onAdd} title="Новый список">+</button>
        </div>
      );
    }

    // ── AddListModal ──────────────────────────────────────────
    /**
     * Модальное окно создания нового списка задач.
     * Пропсы: onAdd(name), onClose()
     */
    function AddListModal({ onAdd, onClose }) {
      const [name, setName] = useState('');

      function handleSubmit(e) {
        e.preventDefault();
        if (!name.trim()) return;
        onAdd(name.trim());
        onClose();
      }

      // Закрываем модальное окно по клавише Escape
      useEffect(() => {
        function onKey(e) { if (e.key === 'Escape') onClose(); }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        // Клик по затемнению закрывает модальное окно
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2>Новый список</h2>
            <form onSubmit={handleSubmit}>
              <input
                type="text"
                placeholder="Название списка"
                value={name}
                onChange={e => setName(e.target.value)}
                autoFocus
                required
              />
              <div className="modal-actions">
                <button type="button" className="btn-cancel" onClick={onClose}>Отмена</button>
                <button type="submit" className="btn-submit">Создать</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ── AddTaskModal ─────────────────────────────────────────
    /**
     * Модальная форма создания новой задачи.
     * Пропсы: onAdd({ title, dueDate }), onClose(), minDate (строка YYYY-MM-DD)
     *
     * minDate передаётся снаружи, чтобы запретить выбор прошедших дат.
     */
    function AddTaskModal({ onAdd, onClose, minDate }) {
      const [title, setTitle]       = useState('');
      const [dueDate, setDueDate]   = useState(getToday); // по умолчанию — сегодня
      const [priority, setPriority] = useState('medium'); // по умолчанию — Средний

      function handleSubmit(e) {
        e.preventDefault();
        if (!title.trim()) return;
        onAdd({ title: title.trim(), dueDate, priority });
        onClose();
      }

      // Закрываем модальное окно по клавише Escape
      useEffect(() => {
        function onKey(e) { if (e.key === 'Escape') onClose(); }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        // Клик по затемнению закрывает модальное окно
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2>Новая задача</h2>
            <form onSubmit={handleSubmit}>
              <input
                type="text"
                placeholder="Название задачи"
                value={title}
                onChange={e => setTitle(e.target.value)}
                autoFocus
                required
              />
              {/* min запрещает выбор прошедших дат прямо в браузерном пикере */}
              <input
                type="date"
                value={dueDate}
                min={minDate}
                onChange={e => setDueDate(e.target.value)}
                required
              />
              {/* Три кнопки выбора приоритета; активная окрашивается в цвет приоритета */}
              <div className="priority-selector">
                {Object.entries(PRIORITIES).map(([key, p]) => (
                  <button
                    key={key}
                    type="button"
                    className="priority-option"
                    style={priority === key
                      ? { background: p.color, borderColor: p.color, color: '#fff' }
                      : {}
                    }
                    onClick={() => setPriority(key)}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
              <div className="modal-actions">
                <button type="button" className="btn-cancel" onClick={onClose}>Отмена</button>
                <button type="submit" className="btn-submit">Добавить</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ── App (корневой компонент) ──────────────────────────────
    function App() {
      // Списки, задачи и активный список — три независимых куска состояния
      const [lists, setLists]               = useState(initialData.lists);
      const [tasks, setTasks]               = useState(initialData.tasks);
      const [activeListId, setActiveListId] = useState(initialData.activeListId);

      const [viewDate, setViewDate]         = useState(getToday); // выбранная дата для просмотра
      const [showTaskModal, setShowTaskModal]   = useState(false);
      const [showListModal, setShowListModal]   = useState(false);

      // Текст мотивационного тоста (null = скрыт)
      const [motivPhrase, setMotivPhrase] = useState(null);
      const motivTimer = useRef(null);

      const today = getToday();

      // Сохраняем все данные при любом изменении
      useEffect(() => {
        saveData({ lists, tasks, activeListId });
      }, [lists, tasks, activeListId]);

      // ── Производные списки ────────────────────────────────

      // Задачи только активного списка
      const activeTasks = tasks.filter(t => t.listId === activeListId);

      // Из активных задач: на сегодня, просроченные, на выбранный будущий день.
      // Каждый список сортируется по приоритету: Высокий → Средний → Низкий.
      const todayTasks   = sortByPriority(activeTasks.filter(t => t.dueDate === today));
      const overdueTasks = sortByPriority(activeTasks.filter(t => t.dueDate < today));
      const futureTasks  = sortByPriority(activeTasks.filter(t => t.dueDate === viewDate));

      // ── Обработчики задач ─────────────────────────────────

      /** Создаёт новую задачу и привязывает её к активному списку. */
      function addTask({ title, dueDate, priority }) {
        const newTask = {
          id: crypto.randomUUID(),
          title,
          dueDate,
          priority,             // 'high' | 'medium' | 'low'
          completed: false,
          createdAt: new Date().toISOString(),
          listId: activeListId, // привязка к текущему списку
        };
        setTasks(prev => [newTask, ...prev]);

        // Показываем случайную мотивационную фразу
        const phrase = MOTIVATIONS[Math.floor(Math.random() * MOTIVATIONS.length)];
        setMotivPhrase(phrase);
        clearTimeout(motivTimer.current);
        motivTimer.current = setTimeout(() => setMotivPhrase(null), 2500);
      }

      /** Переключает флаг выполнения задачи по id. */
      function toggleTask(id) {
        setTasks(prev =>
          prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t)
        );
      }

      /** Удаляет задачу по id. */
      function deleteTask(id) {
        setTasks(prev => prev.filter(t => t.id !== id));
      }

      // ── Обработчики списков ───────────────────────────────

      /** Создаёт новый список и сразу переключается на него. */
      function addList(name) {
        const newList = { id: crypto.randomUUID(), name };
        setLists(prev => [...prev, newList]);
        setActiveListId(newList.id);
        setViewDate(today); // сбрасываем дату при переходе на новый список
      }

      /**
       * Удаляет список и все его задачи.
       * Переключает на первый оставшийся список.
       * Не вызывается, если список единственный (кнопка скрыта в ListTabs).
       */
      function deleteList(id) {
        const remaining = lists.filter(l => l.id !== id);
        setLists(remaining);
        setTasks(prev => prev.filter(t => t.listId !== id));
        // Если удаляем активный список — переходим на первый оставшийся
        if (activeListId === id) {
          setActiveListId(remaining[0].id);
          setViewDate(today);
        }
      }

      /** Переключает активный список и сбрасывает дату просмотра на сегодня. */
      function switchList(id) {
        setActiveListId(id);
        setViewDate(today);
      }

      // Переключает выбранную дату просмотра; запрещает выбирать прошлое
      function handleViewDateChange(e) {
        const picked = e.target.value;
        if (picked >= today) setViewDate(picked);
      }

      // ── Рендер ────────────────────────────────────────────
      const isViewingToday = viewDate === today;

      // Данные для счётчика
      const totalCount    = activeTasks.length;
      const completedCount = activeTasks.filter(t => t.completed).length;

      return (
        <div className="app">
          <header>
            <div className="header-left">
              <h1>To-Do</h1>
              {totalCount > 0 && (
                <span className="task-counter">
                  Задач: {totalCount} · Выполнено:{' '}
                  <span className="counter-done">{completedCount}</span>
                </span>
              )}
            </div>
            <button className="add-btn" onClick={() => setShowTaskModal(true)}>
              + Добавить
            </button>
          </header>

          {/* ── Вкладки списков ── */}
          <ListTabs
            lists={lists}
            activeListId={activeListId}
            onSwitch={switchList}
            onAdd={() => setShowListModal(true)}
            onDelete={deleteList}
          />

          {/* ── Панель навигации по датам ── */}
          <div className="date-nav">
            {/* Пикер даты для выбора дня просмотра; min=today запрещает листать в прошлое */}
            <input
              type="date"
              value={viewDate}
              min={today}
              onChange={handleViewDateChange}
            />
            {/* Кнопка «Сегодня» появляется только когда выбрана другая дата */}
            {!isViewingToday && (
              <button className="today-btn" onClick={() => setViewDate(today)}>
                ← Сегодня
              </button>
            )}
          </div>

          {/* ── Режим просмотра сегодняшнего дня ── */}
          {isViewingToday && (
            <>
              {/* Секция «Сегодня» */}
              <section>
                <h2>Сегодня</h2>
                {todayTasks.length === 0
                  ? <p className="empty">Нет задач на сегодня</p>
                  : todayTasks.map(task => (
                      <TaskItem
                        key={task.id}
                        task={task}
                        isOverdue={false}
                        onToggle={toggleTask}
                        onDelete={deleteTask}
                      />
                    ))
                }
              </section>

              {/* Секция «Просрочено» — показывается только при наличии просроченных задач */}
              {overdueTasks.length > 0 && (
                <section className="overdue-section">
                  <h2>Просрочено</h2>
                  {overdueTasks.map(task => (
                    <TaskItem
                      key={task.id}
                      task={task}
                      isOverdue={true}
                      onToggle={toggleTask}
                      onDelete={deleteTask}
                    />
                  ))}
                </section>
              )}
            </>
          )}

          {/* ── Режим просмотра будущей даты ── */}
          {!isViewingToday && (
            <section>
              <h2>{formatDateHeading(viewDate)}</h2>
              {futureTasks.length === 0
                ? <p className="empty">Нет задач на этот день</p>
                : futureTasks.map(task => (
                    <TaskItem
                      key={task.id}
                      task={task}
                      isOverdue={false}
                      onToggle={toggleTask}
                      onDelete={deleteTask}
                    />
                  ))
              }
            </section>
          )}

          {/* ── Модальное окно добавления задачи ── */}
          {showTaskModal && (
            <AddTaskModal
              onAdd={addTask}
              onClose={() => setShowTaskModal(false)}
              minDate={today}
            />
          )}

          {/* ── Модальное окно создания списка ── */}
          {showListModal && (
            <AddListModal
              onAdd={addList}
              onClose={() => setShowListModal(false)}
            />
          )}

          {/* ── Мотивационный тост ── */}
          {motivPhrase && (
            <div className="motiv-toast">{motivPhrase}</div>
          )}
        </div>
      );
    }

    // Монтируем React-приложение в #root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
