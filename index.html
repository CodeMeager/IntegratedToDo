<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>

  <!-- Стили -->
  <link rel="stylesheet" href="styles.css" />

  <!-- React 18 и ReactDOM через CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel: трансформирует JSX прямо в браузере (подходит для обучения; позже заменить на сборщик) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    Порядок подключения важен: каждый файл использует переменные из предыдущих.
    constants.js → utils.js → компоненты → App.js
  -->
  <script type="text/babel" src="js/constants.js"></script>
  <script type="text/babel" src="js/utils.js"></script>
  <script type="text/babel" src="js/TaskItem.js"></script>
  <script type="text/babel" src="js/ListTabs.js"></script>
  <script type="text/babel" src="js/AddListModal.js"></script>
  <script type="text/babel" src="js/AddTaskModal.js"></script>
  <script type="text/babel" src="js/App.js"></script>
</body>
</html>
